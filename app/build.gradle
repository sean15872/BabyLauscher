plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.babylauscher.offline'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.babylauscher.offline'
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName '0.5.1'
        // Fuer das getestete Realme (ARM64); andere Architekturen bei Bedarf ergaenzen.
        ndk { abiFilters 'arm64-v8a' }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.20.0'
}
